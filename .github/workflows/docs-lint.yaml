name: docs-lint

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'bin/docs-lint'
  pull_request:
    paths:
      - 'docs/**'
      - 'bin/docs-lint'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: bin/docs-lint
