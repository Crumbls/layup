name: docs-lint

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'bin/docs-lint'
  pull_request:
    paths:
      - 'docs/**'
      - 'bin/docs-lint'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: bin/docs-lint
